name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'

      # 固定签名：keystore 存于仓库 Secrets（KEYSTORE_BASE64），构建时解码还原，
      # 口令经环境变量注入 build.gradle；keystore 与口令均不入库，
      # 每次构建与本地使用同一把签名，保证任意版本之间可覆盖安装、签名一致。
      - name: Restore keystore from secrets
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/salary-release.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
        env:
          STORE_FILE: android/keystore/salary-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salary-ledger-release
          path: build/app/outputs/flutter-apk/app-release.apk