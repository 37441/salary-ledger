plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 固定签名配置：GitHub Actions 构建时从环境变量注入（对应仓库 Secrets，保持签名一致）；
// 本地打包时回退到 key.properties（keystore 与口令不入库）。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def envStoreFile = System.getenv('STORE_FILE')
def envStorePassword = System.getenv('STORE_PASSWORD')
def envKeyAlias = System.getenv('KEY_ALIAS')
def envKeyPassword = System.getenv('KEY_PASSWORD')

def signStoreFile = envStoreFile ? file(envStoreFile) : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
def signStorePassword = envStorePassword ?: keystoreProperties['storePassword']
def signKeyAlias = envKeyAlias ?: keystoreProperties['keyAlias']
def signKeyPassword = envKeyPassword ?: keystoreProperties['keyPassword']

android {
    namespace = "com.salary.ledger"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.salary.ledger"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias signKeyAlias
            keyPassword signKeyPassword
            storeFile signStoreFile
            storePassword signStorePassword
        }
    }

    buildTypes {
        release {
            // 固定签名：CI 用 Secrets 注入的 salary-release.keystore，本地用 key.properties，保证每次打包签名一致、可覆盖安装。
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
